<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Signup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app">
  <p class="eyebrow">Loading&hellip;</p>
</div>

<script src="config.js"></script>
<script>
const params = new URLSearchParams(location.search);
const roomId = params.get('room');
const app = document.getElementById('app');

let state = { room: null, selectedSlot: null };
let pollTimer = null;

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtLabel(t) {
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

// taken/capacity -> 'open' | 'warn' | 'full'. Filling-up kicks in at 60%.
function fillStage(taken, capacity) {
  if (taken >= capacity) return 'full';
  if (capacity > 0 && taken / capacity >= 0.6) return 'warn';
  return 'open';
}

function showModal(type, title, message) {
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-card modal-${type}">
        <div class="modal-title">${escapeHtml(title)}</div>
        <p>${escapeHtml(message)}</p>
        <button type="button" class="modal-close">Got it</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('.modal-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  const onEsc = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);
  overlay.querySelector('.modal-close').focus();
}

async function init() {
  if (!roomId) return renderRoomPicker();
  await loadRoom();
}

async function renderRoomPicker() {
  clearInterval(pollTimer);
  app.innerHTML = `<p class="eyebrow">Slot Signup</p><h1>Choose an event</h1><p class="sub">No event was specified in the link.</p><div id="rooms" class="rule"></div>`;
  const rooms = await api('getRooms', {});
  const list = document.getElementById('rooms');
  if (!rooms.length) {
    list.appendChild(el(`<div class="empty-state">No events are open right now.</div>`));
    return;
  }
  rooms.forEach(r => {
    list.appendChild(el(`
      <div class="room-card">
        <div>
          <div class="name">${escapeHtml(r.room_name)}</div>
          <div class="meta">${escapeHtml(r.date || '')}</div>
        </div>
        <div class="actions">
          <span class="pill ${r.locked ? 'locked' : 'open'}">${r.locked ? 'Closed' : 'Open'}</span>
          <a href="?room=${encodeURIComponent(r.room_id)}"><button class="secondary">Open</button></a>
        </div>
      </div>
    `));
  });
}

async function loadRoom() {
  const data = await api('getRoom', { roomId });
  if (data.error) {
    app.innerHTML = `<div class="empty-state">${escapeHtml(data.error)}</div>`;
    return;
  }
  state.room = data;
  render();
}

function render() {
  const r = state.room;
  document.querySelector('.sticky-bar')?.remove();
  app.innerHTML = '';
  app.appendChild(el(`
    <div>
      <p class="eyebrow">Slot Signup</p>
      <h1>${escapeHtml(r.room_name)}</h1>
      <p class="sub">${escapeHtml(r.date || '')}</p>
    </div>
  `));

  if (r.locked) {
    app.appendChild(el(`<div class="banner locked">Bookings are closed for this event. Contact the organiser if you need a change.</div>`));
  }

  app.appendChild(el(`<hr class="rule">`));

  const form = el(`
    <div class="panel">
      <div class="field-row">
        <div class="field">
          <label for="firstNameInput">First name</label>
          <input id="firstNameInput" type="text" placeholder="First name" ${r.locked ? 'disabled' : ''}>
        </div>
        <div class="field">
          <label for="surnameInput">Surname</label>
          <input id="surnameInput" type="text" placeholder="Surname" ${r.locked ? 'disabled' : ''}>
        </div>
      </div>
      <div class="field">
        <label for="mobileInput">Mobile number</label>
        <input id="mobileInput" type="tel" placeholder="e.g. 98765 43210" ${r.locked ? 'disabled' : ''}>
      </div>
      <p class="sub" style="font-size:0.82rem;margin-bottom:1rem;">Your mobile number lets you find and change your slot later from any device.</p>
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:0.5rem;">
        <h2 style="margin:0;">Pick a time</h2>
        <button type="button" id="refreshBtn" class="ghost" style="padding:0.3rem 0.6rem; font-size:0.78rem;">Refresh</button>
      </div>
      <ul class="slot-list" id="slotList"></ul>
      <div style="margin-top:1.25rem;">
        <button id="findBtn" class="ghost" type="button">I already booked &mdash; find my slot</button>
      </div>
    </div>
  `);
  app.appendChild(form);

  app.appendChild(el(`<footer class="nav-back"><a href="?">&larr; All events</a></footer>`));

  const slotList = form.querySelector('#slotList');
  r.slots.forEach(s => {
    const stage = fillStage(s.taken, s.capacity);
    const row = el(`
      <li>
        <button class="slot-row stage-${stage}" data-slot="${s.slot_start}" ${(s.full || r.locked) ? 'disabled' : ''}>
          <span class="slot-time">${fmtLabel(s.slot_start)}</span>
          <span class="capacity-bar-wrap">
            <span class="capacity-bar-track"><span class="capacity-bar-fill stage-${stage}" style="width:${Math.min(100, (s.taken / s.capacity) * 100)}%"></span></span>
            <span class="capacity-count">${s.taken}/${s.capacity}</span>
          </span>
          <span class="slot-status stage-${stage}">${s.full ? 'Full' : (s.capacity - s.taken) + ' left'}</span>
        </button>
      </li>
    `);
    row.querySelector('.slot-row').addEventListener('click', () => selectSlot(s.slot_start, form));
    slotList.appendChild(row);
  });

  form.querySelector('#findBtn').addEventListener('click', () => findMyBooking(form));
  form.querySelector('#refreshBtn').addEventListener('click', () => loadRoom());

  clearInterval(pollTimer);
  if (!r.locked) {
    pollTimer = setInterval(() => {
      if (document.visibilityState === 'visible') refreshSlotCounts(form);
    }, 6000);
  }
}

// Quietly re-fetches slot data and updates capacity bars/counts in place,
// without rebuilding the form (so typed name/mobile and the current
// selection survive) — this is what keeps everyone's screen live.
async function refreshSlotCounts(form) {
  const data = await api('getRoom', { roomId });
  if (data.error) return;
  state.room = data;
  form.querySelectorAll('.slot-row').forEach(row => {
    const s = row.dataset.slot;
    const info = data.slots.find(x => x.slot_start === s);
    if (!info) return;
    const stage = fillStage(info.taken, info.capacity);
    const isSelected = s === state.selectedSlot;
    row.disabled = info.full && !isSelected;
    const fillEl = row.querySelector('.capacity-bar-fill');
    fillEl.style.width = Math.min(100, (info.taken / info.capacity) * 100) + '%';
    fillEl.className = 'capacity-bar-fill stage-' + stage;
    row.querySelector('.capacity-count').textContent = `${info.taken}/${info.capacity}`;
    if (!isSelected) {
      row.classList.remove('stage-open', 'stage-warn', 'stage-full');
      row.classList.add('stage-' + stage);
      const statusEl = row.querySelector('.slot-status');
      statusEl.classList.remove('stage-open', 'stage-warn', 'stage-full');
      statusEl.classList.add('stage-' + stage);
      statusEl.textContent = info.full ? 'Full' : (info.capacity - info.taken) + ' left';
    }
  });
}

function selectSlot(slot, form) {
  state.selectedSlot = slot;
  form.querySelectorAll('.slot-row').forEach(row => {
    const s = row.dataset.slot;
    const info = state.room.slots.find(x => x.slot_start === s);
    const statusEl = row.querySelector('.slot-status');
    const stage = info ? fillStage(info.taken, info.capacity) : 'open';
    row.classList.remove('stage-open', 'stage-warn', 'stage-full', 'is-selected');
    statusEl.classList.remove('stage-open', 'stage-warn', 'stage-full', 'selected');
    if (s === slot) {
      row.classList.add('is-selected');
      statusEl.textContent = 'Selected';
      statusEl.classList.add('selected');
    } else {
      row.classList.add('stage-' + stage);
      statusEl.classList.add('stage-' + stage);
      if (info) statusEl.textContent = info.full ? 'Full' : (info.capacity - info.taken) + ' left';
    }
  });
  showStickyBar(slot, form);
}

function showStickyBar(slot, form) {
  document.querySelector('.sticky-bar')?.remove();
  const bar = el(`
    <div class="sticky-bar">
      <div class="sticky-info">
        <span class="sticky-label">Selected slot</span>
        <span class="sticky-time">${fmtLabel(slot)}</span>
      </div>
      <button id="confirmBtn">Confirm slot</button>
    </div>
  `);
  document.body.appendChild(bar);
  bar.querySelector('#confirmBtn').addEventListener('click', () => confirmBooking(form, bar));
}

async function confirmBooking(form, bar) {
  const first = form.querySelector('#firstNameInput').value.trim();
  const last = form.querySelector('#surnameInput').value.trim();
  const mobile = form.querySelector('#mobileInput').value.trim();
  const name = [first, last].filter(Boolean).join(' ');
  if (!first || !last) {
    showModal('error', 'Missing name', 'Please enter your first name and surname.');
    return;
  }
  if (!mobile) {
    showModal('error', 'Missing mobile number', 'Please enter your mobile number.');
    return;
  }
  if (!state.selectedSlot) return;
  const btn = bar.querySelector('#confirmBtn');
  btn.disabled = true; btn.textContent = 'Booking…';
  const res = await api('bookSlot', { roomId, name, mobile, slot_start: state.selectedSlot });
  if (res.error) {
    showModal('error', "Couldn't book that slot", res.error);
    btn.disabled = false; btn.textContent = 'Confirm slot';
    await loadRoom();
    return;
  }
  const verb = res.updated ? 'Your slot has been updated to' : "You're booked for";
  showModal('success', res.updated ? 'Slot updated' : "You're booked", `${verb} ${fmtLabel(state.selectedSlot)}. You can come back and change it anytime before the organiser locks bookings.`);
  await loadRoom();
}

async function findMyBooking(form) {
  const first = form.querySelector('#firstNameInput').value.trim();
  const last = form.querySelector('#surnameInput').value.trim();
  const mobile = form.querySelector('#mobileInput').value.trim();
  const name = [first, last].filter(Boolean).join(' ');
  if (!name && !mobile) {
    showModal('error', 'Missing details', 'Enter your name or mobile number first.');
    return;
  }
  const res = await api('myBooking', { roomId, name, mobile });
  if (!res.found) {
    showModal('error', 'No booking found', 'No booking found under that name or number.');
    return;
  }
  showModal('success', 'Booking found', `You're booked for ${fmtLabel(res.slot_start)}. Pick a different slot below to move it.`);
}

init();
</script>
</body>
</html>
